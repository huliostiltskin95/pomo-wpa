name: Browser check — Agenda 2.0
on:
  pull_request:
    paths:
      - "agenda-v2.js"
      - "tempo-phase2.js"
      - "tempo-phase2.css"
      - "tests/phase2.e2e.mjs"
      - "agenda-v2.css"
      - "agenda.js"
      - "tempo-details.js"
      - "core/tempo-tasks.js"
      - "app.js"
      - "tests/agenda-v2.e2e.mjs"
      - ".github/workflows/agenda-browser.yml"
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local PWA server
        run: |
          nohup python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/tempvs-http.log 2>&1 &
          sleep 2
      - name: Validate Agenda in Chromium
        run: |
          node tests/agenda-v2.e2e.mjs
          node tests/phase2.e2e.mjs
