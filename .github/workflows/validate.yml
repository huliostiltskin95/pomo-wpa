name: Validate Tempo
on:
  push:
    branches: [main, refactor/shared-core]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-package-lock
      - name: Check PWA JavaScript syntax
        run: |
          node --check simple.js
          node --check core/tempo-simple.js
          node --check app.js
          node --check tempo-ui.js
          node --check tempo-phase1.js
          node --check tempo-phase2.js
          node --check tests/phase3.e2e.mjs
          node --check tempo-details.js
          node --check core/tempo-appearance.js
          node --check agenda.js
          node --check agenda-v2.js
          node --check tempo-fill-ui.js
          node --check core/tempo-fill.js
          node --check core/tempo-tasks.js
          node --check core/tempo-core.js
          node --check core/tempo-audio.js
          npm test
      - name: Build Obsidian plugin
        run: npm run build:obsidian
      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: tempo-obsidian-plugin
          path: |
            obsidian/dist/main.js
            obsidian/dist/manifest.json
            obsidian/dist/styles.css
          if-no-files-found: error
