name: Generate PWA Icons
on:
  push:
    paths:
      - 'icon.svg'
  workflow_dispatch:

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Inkscape (for perfect SVG rendering)
        run: sudo apt-get install -y inkscape
      - name: Generate 192x192 icon
        run: inkscape -w 192 -h 192 icon.svg -o icon-192.png
      - name: Generate 512x512 icon
        run: inkscape -w 512 -h 512 icon.svg -o icon-512.png
      - name: Commit and push PNGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git commit -m "Add raster PWA icons" || echo "No changes to commit"
          git push
