name: Publish TEMPVS for Obsidian

on:
  push:
    branches: ['obsidian-release/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tempvs-obsidian-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out Obsidian plugin sources
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build Obsidian plugin
        run: npm run build:obsidian
      - name: Test plugin and shared core
        run: |
          node --test tests/obsidian-runtime.smoke.mjs tests/tempvs-syntax.test.mjs tests/daily-register.test.mjs tests/google-calendar.test.mjs
      - name: Verify Obsidian UI and daily-note block
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/obsidian-ui.e2e.mjs
      - name: Validate packaged files and version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const plugin=JSON.parse(fs.readFileSync('obsidian/manifest.json','utf8'));
          if(root.version!==plugin.version || root.id!==plugin.id)throw Error('Manifest mismatch');
          if(!/^\d+\.\d+\.\d+$/.test(plugin.version))throw Error('Expected stable semver');
          const versions=JSON.parse(fs.readFileSync('versions.json','utf8'));
          if(versions[plugin.version]!==plugin.minAppVersion)throw Error('Version index mismatch');
          for(const file of ['obsidian/dist/main.js','obsidian/styles.css','obsidian/manifest.json']){
            if(!fs.existsSync(file)||!fs.statSync(file).size)throw Error('Missing '+file);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+plugin.version+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ratio-plugin
          path: obsidian/dist/
  publish-plugin:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ratio-plugin
          path: obsidian/dist
      - name: Publish BRAT-compatible release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists already; refusing to replace a published version."
            exit 1
          fi
          gh release create "$VERSION" \
            obsidian/dist/main.js#main.js \
            obsidian/dist/manifest.json#manifest.json \
            obsidian/dist/styles.css#styles.css \
            --target "${{ github.sha }}" \
            --title "TEMPVS $VERSION" \
            --notes "Fasce orarie facoltative per le attività della daily e colori delle aree nel riepilogo, esclusa la modalità e-ink."
