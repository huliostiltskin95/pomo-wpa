name: Publish TEMPVS Obsidian for BRAT

on:
  push:
    branches: [main]
    paths:
      - 'obsidian/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tempvs-obsidian-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Obsidian plugin sources
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build Obsidian only
        run: npm run build:obsidian
      - name: Test plugin and shared core
        run: |
          npm test
          node --test tests/obsidian-runtime.smoke.mjs tests/*.test.js
      - name: Validate packaged files and version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const plugin=JSON.parse(fs.readFileSync('obsidian/manifest.json','utf8'));
          if(root.version!==plugin.version || root.id!==plugin.id)throw Error('Manifest mismatch');
          if(!/^\d+\.\d+\.\d+$/.test(plugin.version))throw Error('Expected stable semver');
          const versions=JSON.parse(fs.readFileSync('versions.json','utf8'));
          if(versions[plugin.version]!==plugin.minAppVersion)throw Error('Version index mismatch');
          for(const file of ['obsidian/dist/main.js','obsidian/styles.css','obsidian/manifest.json']){
            if(!fs.existsSync(file)||!fs.statSync(file).size)throw Error('Missing '+file);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+plugin.version+'\n');
          NODE
      - name: Publish BRAT-compatible release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists already; refusing to replace a published version."
            exit 1
          fi
          gh release create "$VERSION" \
            obsidian/dist/main.js#main.js \
            obsidian/manifest.json#manifest.json \
            obsidian/styles.css#styles.css \
            --target "${{ github.sha }}" \
            --title "TEMPVS $VERSION" \
            --notes "TEMPVS Obsidian: pianificazione con durata lorda dei pomodori. Studio @2h +14:00 -60m produce due cicli da 50 minuti di focus e 10 di pausa. Disponibile anche il campo guidato Pomodoro lordo. Aggiornamento tramite BRAT."
