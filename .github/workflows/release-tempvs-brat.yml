name: Publish TEMPVS PWA and BRAT

on:
  push:
    branches: [main]
    paths:
      - 'obsidian/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tempvs-obsidian-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out Obsidian plugin sources
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Build PWA and plugin from the same core
        run: npm run build:all
      - name: Test plugin and shared core
        run: |
          npm test
          node --test tests/obsidian-runtime.smoke.mjs
      - name: Verify Obsidian UI and daily-note block
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          node tests/obsidian-ui.e2e.mjs
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist/pwa >/tmp/tempvs-http.log 2>&1 &
          node tests/simple.e2e.mjs
          node tests/pwa-consolidation.e2e.mjs
          node tests/timer-pip.e2e.mjs
      - name: Validate packaged files and version
        id: version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const plugin=JSON.parse(fs.readFileSync('obsidian/manifest.json','utf8'));
          if(root.version!==plugin.version || root.id!==plugin.id)throw Error('Manifest mismatch');
          if(!/^\d+\.\d+\.\d+$/.test(plugin.version))throw Error('Expected stable semver');
          const versions=JSON.parse(fs.readFileSync('versions.json','utf8'));
          if(versions[plugin.version]!==plugin.minAppVersion)throw Error('Version index mismatch');
          for(const file of ['obsidian/dist/main.js','obsidian/styles.css','obsidian/manifest.json']){
            if(!fs.existsSync(file)||!fs.statSync(file).size)throw Error('Missing '+file);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+plugin.version+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: ratio-pwa
          path: dist/pwa/
      - uses: actions/upload-artifact@v4
        with:
          name: ratio-plugin
          path: obsidian/dist/
  deploy-pwa:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ratio-pwa
          path: dist/pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/pwa
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
  publish-plugin:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ratio-plugin
          path: obsidian/dist
      - name: Publish BRAT-compatible release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists already; refusing to replace a published version."
            exit 1
          fi
          gh release create "$VERSION" \
            obsidian/dist/main.js#main.js \
            obsidian/dist/manifest.json#manifest.json \
            obsidian/dist/styles.css#styles.css \
            --target "${{ github.sha }}" \
            --title "TEMPVS $VERSION" \
            --notes "Righe giornaliere con durata, numero di pomodori e orario di inizio facoltativo."
