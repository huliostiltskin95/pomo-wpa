name: TEMPVS coordinated build and release
on:
  pull_request:
  push:
    branches:
      - main
      - feature/coordinated-release-phase4
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tempvs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - run: npm run build:all
      - name: Package Obsidian plugin
        run: |
          mkdir -p dist/obsidian
          cp obsidian/dist/main.js dist/obsidian/main.js
          cp obsidian/styles.css dist/obsidian/styles.css
          cp manifest.json dist/obsidian/manifest.json
          cp versions.json dist/obsidian/versions.json
      - uses: actions/upload-artifact@v4
        with:
          name: tempvs-obsidian
          path: dist/obsidian/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tempvs-pwa
          path: dist/pwa/
          if-no-files-found: error

  browser-smoke:
    needs: verify-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: tempvs-pwa
          path: dist/pwa
      - name: Browser smoke against staged PWA
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist/pwa >/tmp/tempvs-http.log 2>&1 &
          sleep 2
          node tests/simple.e2e.mjs

  deploy-pwa:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-build, browser-smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tempvs-pwa
          path: dist/pwa
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa
      - id: deployment
        uses: actions/deploy-pages@v4

  release-obsidian:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy-pwa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tempvs-obsidian
          path: release
      - name: Publish GitHub Release for BRAT
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG"             release/main.js release/manifest.json release/styles.css release/versions.json             --repo "$REPOSITORY"             --verify-tag             --title "TEMPVS $RELEASE_TAG"             --generate-notes
