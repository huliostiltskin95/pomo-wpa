<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Pomodoro Planner</title>

    <!-- PWA & Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pomodoro">
    <link rel="apple-touch-icon" href="[https://cdn-icons-png.flaticon.com/512/3073/3073611.png](https://cdn-icons-png.flaticon.com/512/3073/3073611.png)">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Tailwind CSS CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#3b82f6',
                        focusColor: '#ef4444',
                        breakColor: '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans flex flex-col justify-between p-4 md:p-8">

    <!-- Header & Status Bar -->
    <header class="max-w-5xl mx-auto w-full flex flex-wrap justify-between items-center gap-4 mb-6 border-b border-slate-700 pb-4">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">🍅</span>
            <div>
                <h1 class="text-xl font-bold tracking-wide">Focus Pomodoro</h1>
                <p class="text-xs text-slate-400">Pianificatore con Avvio Automatico e Notifiche</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <button id="notifBtn" onclick="requestNotificationPermission()" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg transition">
                🔔 Attiva Notifiche
            </button>
            <button id="audioTestBtn" onclick="testAudio()" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg transition">
                🎵 Test Audio
            </button>
            <span id="wakeLockBadge" class="text-xs px-2 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700">
                🔒 Schermo: Normale
            </span>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 mb-auto">
        
        <!-- Left Column: Timer Display & Active Session -->
        <section class="lg:col-span-6 flex flex-col items-center justify-center bg-cardbg p-6 rounded-2xl border border-slate-800 shadow-2xl relative overflow-hidden">
            
            <!-- Banner Sessione Programmata Attiva -->
            <div id="activeSessionBanner" class="w-full mb-4 p-3 bg-slate-900 border border-slate-700 rounded-xl hidden">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs uppercase tracking-wider font-bold text-accent">Sessione In Corso</span>
                    <span id="bannerTotalRemaining" class="text-xs font-mono bg-slate-800 px-2 py-0.5 rounded text-amber-400">Tempo Totale: --:--:--</span>
                </div>
                <h2 id="bannerSessionTitle" class="text-base font-semibold truncate text-slate-100">---</h2>
                <div class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                    <div id="bannerProgressBar" class="bg-accent h-full w-full transition-all duration-500"></div>
                </div>
            </div>

            <!-- Mode Selector / Status -->
            <div id="modeBadge" class="mb-4 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-focusColor/20 text-focusColor border border-focusColor/40">
                Focus Mode
            </div>

            <!-- Circular Progress Timer -->
            <div class="relative w-64 h-64 flex items-center justify-center my-2">
                <svg class="w-full h-full" viewBox="0 0 120 120">
                    <circle class="text-slate-800" stroke-width="8" stroke="currentColor" fill="transparent" r="52" cx="60" cy="60"/>
                    <circle id="timerProgressRing" class="progress-ring__circle text-focusColor" stroke-width="8" stroke-dasharray="326.72" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="52" cx="60" cy="60"/>
                </svg>
                <div class="absolute flex flex-col items-center">
                    <span id="timerDisplay" class="text-5xl font-mono font-extrabold tracking-tight">25:00</span>
                    <span id="timerSubtext" class="text-xs text-slate-400 mt-1">Senza sessione programmata</span>
                </div>
            </div>

            <!-- Timer Controls -->
            <div class="flex items-center space-x-4 mt-4">
                <button id="startPauseBtn" onclick="toggleTimer()" class="w-14 h-14 rounded-full bg-accent hover:bg-blue-600 text-white flex items-center justify-center text-xl shadow-lg transition transform active:scale-95">
                    ▶
                </button>
                <button onclick="resetTimer()" class="p-3 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm transition">
                    🔄 Reset
                </button>
                <button onclick="skipBlock()" class="p-3 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm transition" title="Salta blocco corrente">
                    ⏭ Salta
                </button>
            </div>
        </section>

        <!-- Right Column: Scheduler Form & Upcoming Sessions -->
        <section class="lg:col-span-6 flex flex-col space-y-6">
            
            <!-- Session Scheduler Form -->
            <div class="bg-cardbg p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h3 class="text-base font-bold text-slate-200 mb-4 flex items-center space-x-2">
                    <span>📅</span>
                    <span>Programma Nuova Sessione</span>
                </h3>
                <form id="scheduleForm" onsubmit="handleScheduleSession(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Nome Attività / Studio</label>
                        <input type="text" id="sessionTitle" required placeholder="Es. Studio Storia, Ripasso..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-accent">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Data</label>
                            <input type="date" id="sessionDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Ora Inizio</label>
                            <input type="time" id="sessionTime" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-accent">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Totale (min)</label>
                            <input type="number" id="sessionTotalMin" min="5" value="120" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Focus (min)</label>
                            <input type="number" id="sessionFocusMin" min="1" value="25" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-accent">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Pausa (min)</label>
                            <input type="number" id="sessionBreakMin" min="1" value="5" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-accent">
                        </div>
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg text-sm transition shadow-md">
                        + Salva e Programma Avvio
                    </button>
                </form>
            </div>

            <!-- Scheduled Sessions List -->
            <div class="bg-cardbg p-6 rounded-2xl border border-slate-800 shadow-xl flex-1 flex flex-col">
                <h3 class="text-base font-bold text-slate-200 mb-3 flex justify-between items-center">
                    <span>📋 Sessioni Programmate</span>
                    <span id="sessionCountBadge" class="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-400">0</span>
                </h3>
                
                <div id="sessionsContainer" class="space-y-2 overflow-y-auto max-h-60 pr-1 flex-1">
                    <!-- Cards inserite dinamicamente -->
                </div>
            </div>

        </section>
    </main>

    <footer class="max-w-5xl mx-auto w-full text-center text-xs text-slate-500 mt-6 pt-4 border-t border-slate-800">
        Focus Pomodoro PWA • Funziona offline e invia notifiche di sistema
    </footer>

    <script>
        // --- Web Audio API Synthesizer ---
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playChime(type) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'start') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.3); // E5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'break') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now); // A4
                    osc.frequency.setValueAtTime(349.23, now + 0.2); // F4
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.2, now + i * 0.12);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.12);
                        osc.stop(now + i * 0.12 + 0.4);
                    });
                }
            } catch (e) {
                console.warn('Audio non riproducibile:', e);
            }
        }

        function testAudio() {
            playChime('victory');
            requestWakeLock();
        }

        // --- Notification API & Service Worker Messaging ---
        async function requestNotificationPermission() {
            if ('Notification' in window) {
                const permission = await Notification.requestPermission();
                updateNotificationBtnUI(permission);
                if (permission === 'granted') {
                    sendNativeNotification('Notifiche Attivate! 🍅', 'Riceverai un avviso nativo allo scadere di ogni blocco.');
                }
            } else {
                alert('Le notifiche non sono supportate da questo browser.');
            }
        }

        function updateNotificationBtnUI(permission) {
            const btn = document.getElementById('notifBtn');
            if (!btn) return;
            if (permission === 'granted') {
                btn.textContent = '🔔 Notifiche: Attive';
                btn.className = 'px-3 py-1.5 text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-lg';
            } else if (permission === 'denied') {
                btn.textContent = '🔕 Notifiche: Bloccate';
                btn.className = 'px-3 py-1.5 text-xs font-semibold bg-red-950 text-red-400 border border-red-800 rounded-lg';
            }
        }

        function sendNativeNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification(title, {
                            body: body,
                            icon: '[https://cdn-icons-png.flaticon.com/512/3073/3073611.png](https://cdn-icons-png.flaticon.com/512/3073/3073611.png)',
                            badge: '[https://cdn-icons-png.flaticon.com/512/3073/3073611.png](https://cdn-icons-png.flaticon.com/512/3073/3073611.png)',
                            vibrate: [300, 100, 300],
                            tag: 'pomodoro-alert',
                            renotify: true
                        });
                    });
                }
            }
        }

        // --- Screen Wake Lock API ---
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakeLockBadge').textContent = '🔒 Schermo: Attivo';
                    document.getElementById('wakeLockBadge').className = 'text-xs px-2 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-800';
                } catch (err) {
                    console.warn(`Wake Lock non attivo: ${err.message}`);
                }
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                await wakeLock.release();
                wakeLock = null;
                document.getElementById('wakeLockBadge').textContent = '🔒 Schermo: Normale';
                document.getElementById('wakeLockBadge').className = 'text-xs px-2 py-1 rounded bg-slate-800 text-slate-400 border border-slate-700';
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
                await requestWakeLock();
            }
        });

        // --- State Variables ---
        let sessions = JSON.parse(localStorage.getItem('pomodoro_sessions') || '[]');
        let currentSession = null;
        let isRunning = false;
        let timerMode = 'focus'; // 'focus' | 'break'
        
        let timerSeconds = 25 * 60;
        let blockTotalSeconds = 25 * 60;
        let totalSessionSecondsRemaining = 0;
        let initialTotalSessionSeconds = 0;

        const CIRCLE_CIRCUMFERENCE = 326.72;

        document.getElementById('sessionDate').value = new Date().toISOString().split('T')[0];

        // --- Core Functions ---
        function saveSessions() {
            localStorage.setItem('pomodoro_sessions', JSON.stringify(sessions));
            renderSessionsList();
        }

        function handleScheduleSession(e) {
            e.preventDefault();
            const title = document.getElementById('sessionTitle').value;
            const date = document.getElementById('sessionDate').value;
            const time = document.getElementById('sessionTime').value;
            const totalMinutes = parseInt(document.getElementById('sessionTotalMin').value);
            const focusMinutes = parseInt(document.getElementById('sessionFocusMin').value);
            const breakMinutes = parseInt(document.getElementById('sessionBreakMin').value);

            const newSession = {
                id: Date.now().toString(),
                title,
                date,
                time,
                totalMinutes,
                focusMinutes,
                breakMinutes,
                status: 'pending' // 'pending' | 'active' | 'completed'
            };

            sessions.push(newSession);
            saveSessions();
            document.getElementById('sessionTitle').value = '';
        }

        function deleteSession(id) {
            sessions = sessions.filter(s => [s.id](http://s.id) !== id);
            if (currentSession && currentSession.id === id) {
                resetTimer();
            }
            saveSessions();
        }

        function manualStartSession(id) {
            const session = sessions.find(s => [s.id](http://s.id) === id);
            if (session) {
                startSession(session);
            }
        }

        function startSession(session) {
            currentSession = session;
            session.status = 'active';
            
            timerMode = 'focus';
            blockTotalSeconds = session.focusMinutes * 60;
            timerSeconds = blockTotalSeconds;
            
            initialTotalSessionSeconds = session.totalMinutes * 60;
            totalSessionSecondsRemaining = initialTotalSessionSeconds;

            isRunning = true;
            playChime('start');
            requestWakeLock();
            sendNativeNotification('🍅 Sessione Avviata!', `Iniziata la sessione: ${session.title}`);
            saveSessions();
            updateUI();
        }

        function toggleTimer() {
            getAudioContext();
            isRunning = !isRunning;
            if (isRunning) {
                requestWakeLock();
            } else {
                releaseWakeLock();
            }
            updateUI();
        }

        function resetTimer() {
            isRunning = false;
            releaseWakeLock();
            if (currentSession) {
                currentSession.status = 'pending';
                currentSession = null;
            }
            timerMode = 'focus';
            timerSeconds = 25 * 60;
            blockTotalSeconds = 25 * 60;
            totalSessionSecondsRemaining = 0;
            saveSessions();
            updateUI();
        }

        function skipBlock() {
            if (timerMode === 'focus') {
                timerMode = 'break';
                blockTotalSeconds = (currentSession ? currentSession.breakMinutes : 5) * 60;
                timerSeconds = blockTotalSeconds;
                playChime('break');
                sendNativeNotification('☕ Tempo di Pausa!', 'Il blocco di Focus è terminato. Rilassati un po\'.');
            } else {
                timerMode = 'focus';
                blockTotalSeconds = (currentSession ? currentSession.focusMinutes : 25) * 60;
                timerSeconds = blockTotalSeconds;
                playChime('start');
                sendNativeNotification('⚡ Ritorna al Focus!', 'La pausa è finita. Si torna al lavoro!');
            }
            updateUI();
        }

        function completeSession() {
            if (currentSession) {
                currentSession.status = 'completed';
                currentSession = null;
            }
            isRunning = false;
            releaseWakeLock();
            playChime('victory');
            sendNativeNotification('🎉 Sessione Completata!', 'Ottimo lavoro! Hai completato la durata totale programmata.');
            saveSessions();
            updateUI();
        }

        // --- Auto-Start Engine & Main Loop ---
        setInterval(() => {
            const now = new Date();
            const currentDate = now.toISOString().split('T')[0];
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTime = `${currentHours}:${currentMinutes}`;

            // Controllo e avvio automatico sessioni
            sessions.forEach(s => {
                if (s.status === 'pending' && s.date === currentDate && s.time === currentTime) {
                    startSession(s);
                }
            });

            // Decremento timer
            if (isRunning) {
                if (currentSession && totalSessionSecondsRemaining > 0) {
                    totalSessionSecondsRemaining--;
                    if (totalSessionSecondsRemaining <= 0) {
                        completeSession();
                        return;
                    }
                }

                if (timerSeconds > 0) {
                    timerSeconds--;
                } else {
                    skipBlock();
                }
                updateUI();
            }
        }, 1000);

        // --- Render UI ---
        function updateUI() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = timeStr;
            document.title = `${timeStr} - ${timerMode === 'focus' ? 'Focus' : 'Pausa'}`;

            const ring = document.getElementById('timerProgressRing');
            const progress = blockTotalSeconds > 0 ? (blockTotalSeconds - timerSeconds) / blockTotalSeconds : 0;
            const offset = CIRCLE_CIRCUMFERENCE - (progress * CIRCLE_CIRCUMFERENCE);
            ring.style.strokeDashoffset = offset;

            const badge = document.getElementById('modeBadge');
            if (timerMode === 'focus') {
                badge.textContent = 'FOCUS MODE';
                badge.className = 'mb-4 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-focusColor/20 text-focusColor border border-focusColor/40';
                ring.className = 'progress-ring__circle text-focusColor';
            } else {
                badge.textContent = 'PAUSA MODE';
                badge.className = 'mb-4 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-breakColor/20 text-breakColor border border-breakColor/40';
                ring.className = 'progress-ring__circle text-breakColor';
            }

            document.getElementById('startPauseBtn').textContent = isRunning ? '⏸' : '▶';

            const banner = document.getElementById('activeSessionBanner');
            if (currentSession) {
                banner.classList.remove('hidden');
                document.getElementById('bannerSessionTitle').textContent = currentSession.title;
                document.getElementById('timerSubtext').textContent = currentSession.title;

                const totH = Math.floor(totalSessionSecondsRemaining / 3600);
                const totM = Math.floor((totalSessionSecondsRemaining % 3600) / 60);
                const totS = totalSessionSecondsRemaining % 60;
                document.getElementById('bannerTotalRemaining').textContent = 
                    `Tempo Totale: ${String(totH).padStart(2, '0')}:${String(totM).padStart(2, '0')}:${String(totS).padStart(2, '0')}`;

                const totalProgress = initialTotalSessionSeconds > 0 ? (totalSessionSecondsRemaining / initialTotalSessionSeconds) * 100 : 0;
                document.getElementById('bannerProgressBar').style.width = `${totalProgress}%`;
            } else {
                banner.classList.add('hidden');
                document.getElementById('timerSubtext').textContent = 'Senza sessione programmata';
            }
        }

        function renderSessionsList() {
            const container = document.getElementById('sessionsContainer');
            document.getElementById('sessionCountBadge').textContent = sessions.length;

            if (sessions.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 text-center py-6">Nessuna sessione in programma</div>`;
                return;
            }

            container.innerHTML = sessions.map(s => {
                let statusBadge = '';
                if (s.status === 'pending') statusBadge = `<span class="text-[10px] px-2 py-0.5 rounded bg-amber-950 text-amber-400 border border-amber-800">In attesa</span>`;
                if (s.status === 'active') statusBadge = `<span class="text-[10px] px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800">In corso</span>`;
                if (s.status === 'completed') statusBadge = `<span class="text-[10px] px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">Completata</span>`;

                return `
                    <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/60 flex justify-between items-center">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-semibold text-sm text-slate-200">${s.title}</span>
                                ${statusBadge}
                            </div>
                            <div class="text-xs text-slate-400 flex items-center space-x-3">
                                <span>📅 ${s.date} ${s.time}</span>
                                <span>⏱️ Tot: ${s.totalMinutes}m (F:${s.focusMinutes}m / P:${s.breakMinutes}m)</span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            ${s.status === 'pending' ? `<button onclick="manualStartSession('${[s.id](http://s.id)}')" class="px-2 py-1 text-xs bg-accent hover:bg-blue-600 text-white rounded transition">Avvia</button>` : ''}
                            <button onclick="deleteSession('${[s.id](http://s.id)}')" class="px-2 py-1 text-xs bg-slate-800 hover:bg-red-900/60 text-slate-400 hover:text-red-300 rounded transition">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Init Service Worker & Notifications State
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker registrato'))
                    .catch(err => console.log('Errore Service Worker:', err));
            });
        }

        if ('Notification' in window) {
            updateNotificationBtnUI(Notification.permission);
        }

        renderSessionsList();
        updateUI();
    </script>
